<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Your Face - Glowvai</title>
  
  <!-- CSS for International Phone Input -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css"/>
  
  <style>
    /* Clean, minimal, high-contrast Apple-inspired aesthetic */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9f9f9;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    .scan-container {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 24px;
      padding: 40px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h2 { margin-top: 0; font-weight: 600; letter-spacing: -0.5px; }
    p { color: #555; font-size: 14px; margin-bottom: 24px; }

    /* Camera Viewfinder */
    .video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      margin-bottom: 24px;
      aspect-ratio: 3/4;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
    }
    
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { display: none; width: 100%; height: 100%; object-fit: cover; }

    /* Form Elements */
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: 1px solid #ddd;
      background: #fff;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus, input[type="tel"]:focus { 
      border-color: #111; 
      box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
    }

    /* Fix for intl-tel-input width */
    .iti { width: 100%; margin-bottom: 16px; text-align: left; }
    .iti__input { width: 100% !important; margin-bottom: 0 !important; }

    .consent-wrapper {
      display: flex;
      align-items: flex-start;
      text-align: left;
      font-size: 12px;
      color: #666;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .consent-wrapper input { margin-right: 10px; margin-top: 2px; }

    .primary-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: #111;
      color: #fff;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .primary-btn:active { transform: scale(0.98); }
    .primary-btn:disabled { background: #ccc; cursor: not-allowed; }

    #loading-state { display: none; margin-top: 20px; font-weight: 500; color: #111; }
    #scan-warning { color: #d93025; font-size: 13px; display: none; margin-bottom: 16px; font-weight: 500; }
    #phone-error { color: #d93025; font-size: 12px; display: none; margin-top: -10px; margin-bottom: 16px; text-align: left; font-weight: 500; }
  </style>
</head>
<body>

  <div class="scan-container">
    <h2>Skin Analysis</h2>
    <p>Center your face in the frame with good lighting. Remove any glasses or masks.</p>

    <div class="video-wrapper">
      <video id="camera-stream" autoplay playsinline></video>
      <canvas id="capture-canvas"></canvas>
    </div>

    <div id="scan-warning">⚠️ Please ensure your face is clearly visible, well-lit, and remove any glasses or masks.</div>

    <form id="scan-form">
      <input type="text" id="scan-name" placeholder="Full Name" required>
      
      <!-- Phone Input with Intl-Tel-Input -->
      <input type="tel" id="scan-phone" required>
      <div id="phone-error">Please enter a valid phone number.</div>
      
      <div class="consent-wrapper">
        <input type="checkbox" id="scan-consent" required>
        <label for="scan-consent">I consent to Glowvai analyzing my facial features to generate a customized diagnostic skin report.</label>
      </div>

      <button type="submit" id="scan-btn" class="primary-btn">Analyze My Skin</button>
    </form>

    <div id="loading-state">Connecting to Glowvai Cloud AI...</div>
  </div>

  <!-- JS for International Phone Input -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>

  <script>
    const video = document.getElementById('camera-stream');
    const canvas = document.getElementById('capture-canvas');
    const scanForm = document.getElementById('scan-form');
    const scanBtn = document.getElementById('scan-btn');
    const loadingState = document.getElementById('loading-state');
    const phoneInput = document.getElementById('scan-phone');
    const phoneError = document.getElementById('phone-error');
    const scanWarning = document.getElementById('scan-warning');
    
    // Endpoints
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmEqNgAk5cPP2n5kRNd83UrAhGThXwXFsk17bhtCG8HVl2ngQSROlxdJGUchEVwRVfBw/exec";
    const RENDER_API_URL = "https://glowvai-api-v2.onrender.com/analyze-skin";

    // 1. Initialize International Phone Input
    const iti = window.intlTelInput(phoneInput, {
      initialCountry: "auto",
      geoIpLookup: function(success, failure) {
        fetch("https://ipapi.co/json")
          .then(function(res) { return res.json(); })
          .then(function(data) { success(data.country_code); })
          .catch(function() { success("in"); });
      },
      utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js",
    });

    // 2. Initialize Camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;
      } catch (err) {
        alert("Camera access is required for the analysis.");
        console.error("Camera Error:", err);
      }
    }
    startCamera();

    // 3. Simple Client-Side Frame Quality & Anti-Random-Object Check
    function validateImageQuality(context, width, height) {
      const imgData = context.getImageData(0, 0, width, height);
      const pixels = imgData.data;
      let colorVariance = 0;
      let totalBrightness = 0;
      
      // Sample pixels to verify it's not a completely black image, random wall, or blank noise
      const sampleStep = 50;
      let samples = 0;
      for (let i = 0; i < pixels.length; i += (4 * sampleStep)) {
        const r = pixels[i];
        const g = pixels[i+1];
        const b = pixels[i+2];
        const brightness = (r + g + b) / 3;
        totalBrightness += brightness;
        colorVariance += Math.abs(r - g) + Math.abs(g - b);
        samples++;
      }
      
      const avgBrightness = totalBrightness / samples;
      const avgVariance = colorVariance / samples;

      // Fail if too dark (underlit) or completely flat color (random wall/object)
      if (avgBrightness < 30) return "too_dark";
      if (avgBrightness > 240) return "too_bright";
      if (avgVariance < 8) return "invalid_surface"; // Likely a blank wall or random non-face object
      return "passed";
    }

    // 4. Hybrid Location Fetcher
    async function getIPLocationFallback() {
      try {
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();
        return `${data.city}, ${data.region} (IP Fallback)`; 
      } catch (error) {
        return "Location unavailable";
      }
    }

    async function getHybridLocation() {
      return new Promise((resolve) => {
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (position) => { resolve(`${position.coords.latitude}, ${position.coords.longitude} (Exact GPS)`); },
            async (error) => {
              const ipFallback = await getIPLocationFallback();
              resolve(ipFallback);
            },
            { timeout: 5000, enableHighAccuracy: true } 
          );
        } else {
          getIPLocationFallback().then(resolve);
        }
      });
    }

    // 5. Handle Scan Submission
    scanForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      scanWarning.style.display = "none";
      
      // Enforce strict phone validation
      if (!iti.isValidNumber()) {
        phoneError.style.display = "block";
        phoneInput.style.borderColor = "#d93025";
        return; 
      }
      
      phoneError.style.display = "none";
      phoneInput.style.borderColor = "#111";
      
      scanBtn.style.display = 'none';
      scanForm.style.display = 'none';
      loadingState.style.display = 'block';

      // Capture Image
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const context = canvas.getContext('2d');
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // Quality Check Validation
      const qualityCheck = validateImageQuality(context, canvas.width, canvas.height);
      if (qualityCheck !== "passed") {
        loadingState.style.display = 'none';
        scanForm.style.display = 'block';
        scanBtn.style.display = 'block';
        scanWarning.style.display = 'block';
        if(qualityCheck === "too_dark") {
          scanWarning.innerText = "⚠️ Lighting too dark. Please move to a well-lit area.";
        } else {
          scanWarning.innerText = "⚠️ Invalid scan target detected. Please center your actual face in the frame.";
        }
        return;
      }

      const base64Image = canvas.toDataURL('image/jpeg', 0.85);
      
      video.style.display = 'none';
      canvas.style.display = 'block';

      const location = await getHybridLocation();

      const payload = {
        type: "web_scan",
        name: document.getElementById('scan-name').value,
        phone: iti.getNumber(),
        location: location,
        imageBase64: base64Image,
        consent: document.getElementById('scan-consent').checked
      };

      try {
        // 1. Save data via Google Apps Script (Backup & Sheets logging)
        fetch(APP_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        loadingState.innerText = "Analyzing skin textures with Render Cloud AI...";

        // 2. Direct call to Render Cloud Backend for real-time AI results
        const aiResponse = await fetch(RENDER_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!aiResponse.ok) {
          throw new Error("Cloud analysis engine responded with an error.");
        }

        const resultData = await aiResponse.json();
        
        // Safely stop camera hardware
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(track => track.stop());
        }

        loadingState.innerText = "Analysis complete! Redirecting to your report...";
        
        // Redirect to results page passing data/ID
        setTimeout(() => {
          window.location.href = `results.html?status=success&name=${encodeURIComponent(payload.name)}`;
        }, 1000);

      } catch (err) {
        console.error("Analysis Pipeline Error:", err);
        loadingState.innerText = "Server warming up or network timeout. Retrying connection...";
        
        // Fallback redirect if Render server was sleeping and took time to wake up
        setTimeout(() => {
          window.location.href = `results.html?status=saved&name=${encodeURIComponent(payload.name)}`;
        }, 2000);
      }
    });
  </script>
</body>
</html>
