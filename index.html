<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Your Face - Glowvai</title>
  
  <!-- CSS for International Phone Input -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css"/>
  
  <style>
    /* Clean, Apple-inspired minimal glassmorphic aesthetic */
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.75);
      --text-main: #1d1d1f;
      --text-muted: #86868b;
      --accent: #0071e3;
      --danger: #ff3b30;
      --success: #34c759;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    
    .scan-container {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 28px;
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    h2 { 
      margin: 0 0 8px 0; 
      font-weight: 700; 
      font-size: 24px;
      letter-spacing: -0.5px; 
    }
    
    p { 
      color: var(--text-muted); 
      font-size: 14px; 
      margin: 0 0 24px 0; 
      line-height: 1.4;
    }

    /* Camera Viewfinder & Scanning Animation */
    .video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      margin-bottom: 24px;
      aspect-ratio: 3/4;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
      transform: translateZ(0); 
    }
    
    video, canvas { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      display: block;
    }
    canvas { display: none; }

    /* The Scanning Laser Effect */
    .scanner-laser {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 15px 4px rgba(255, 255, 255, 0.5);
      display: none;
      z-index: 10;
      animation: scan-animation 2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    @keyframes scan-animation {
      0% { top: 5%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 95%; opacity: 0; }
    }

    /* Form Elements */
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.1);
      background: rgba(255,255,255,0.9);
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s ease;
    }
    input[type="text"]:focus, input[type="tel"]:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
    }

    .iti { width: 100%; margin-bottom: 16px; text-align: left; }
    .iti__input { width: 100% !important; margin-bottom: 0 !important; }

    .consent-wrapper {
      display: flex;
      align-items: flex-start;
      text-align: left;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .consent-wrapper input { margin-right: 12px; margin-top: 3px; cursor: pointer; }

    .primary-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: var(--text-main);
      color: #fff;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .primary-btn:active { transform: scale(0.97); }
    .primary-btn:disabled { background: var(--text-muted); cursor: not-allowed; }

    /* Status & Alerts */
    #status-container {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 12px;
    }
    
    .status-text { 
      font-weight: 600; 
      font-size: 15px;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    
    .status-subtext {
      font-size: 13px;
      color: var(--text-muted);
    }

    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
      text-align: left;
      animation: slideDown 0.3s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .alert-danger { background: rgba(255, 59, 48, 0.1); color: var(--danger); border: 1px solid rgba(255, 59, 48, 0.2); }
    .alert-warning { background: rgba(255, 149, 0, 0.1); color: #d97706; border: 1px solid rgba(255, 149, 0, 0.2); }
  </style>
</head>
<body>

  <div class="scan-container">
    <h2>GLOWVAI</h2>
    <p>Center your face in good lighting. Please remove glasses or masks for accurate analysis.</p>

    <div class="video-wrapper">
      <video id="camera-stream" autoplay playsinline></video>
      <canvas id="capture-canvas"></canvas>
      <div id="scanner-laser" class="scanner-laser"></div>
    </div>

    <!-- Dynamic Alerts -->
    <div id="scan-alert" class="alert alert-danger"></div>

    <form id="scan-form">
      <input type="text" id="scan-name" placeholder="Full Name" required autocomplete="name">
      
      <input type="tel" id="scan-phone" required>
      
      <div class="consent-wrapper">
        <input type="checkbox" id="scan-consent" required>
        <label for="scan-consent">I consent to Glowvai analyzing my facial features to generate a customized diagnostic skin report.</label>
      </div>

      <button type="submit" id="scan-btn" class="primary-btn">Start Analysis</button>
    </form>

    <!-- Interactive Loading State -->
    <div id="status-container">
      <div id="status-text" class="status-text">Uploading secure image...</div>
      <div id="status-subtext" class="status-subtext">Initializing cloud connection</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>

  <script>
    // Elements
    const video = document.getElementById('camera-stream');
    const canvas = document.getElementById('capture-canvas');
    const laser = document.getElementById('scanner-laser');
    const scanForm = document.getElementById('scan-form');
    const statusContainer = document.getElementById('status-container');
    const statusText = document.getElementById('status-text');
    const statusSubtext = document.getElementById('status-subtext');
    const scanAlert = document.getElementById('scan-alert');
    const phoneInput = document.getElementById('scan-phone');
    
    // API Endpoints
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmEqNgAk5cPP2n5kRNd83UrAhGThXwXFsk17bhtCG8HVl2ngQSROlxdJGUchEVwRVfBw/exec";
    const RENDER_API_URL = "https://glowvai-api-v2.onrender.com/analyze-skin";

    // 1. Initialize Phone Input
    const iti = window.intlTelInput(phoneInput, {
      initialCountry: "auto",
      geoIpLookup: function(success, failure) {
        fetch("https://ipapi.co/json").then(res => res.json()).then(data => success(data.country_code)).catch(() => success("in"));
      },
      utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js",
    });

    // 2. Start Camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;
        video.style.display = 'block';
        canvas.style.display = 'none';
        laser.style.display = 'none';
      } catch (err) {
        showAlert("Camera access denied. Please enable permissions to scan.", "danger");
      }
    }
    startCamera();

    // 3. Display Alerts
    function showAlert(message, type = "danger") {
      scanAlert.className = `alert alert-${type}`;
      scanAlert.innerHTML = `<strong>Attention:</strong> ${message}`;
      scanAlert.style.display = 'block';
    }
    function hideAlert() { scanAlert.style.display = 'none'; }

    // 4. Client-Side Integrity Check (Prevents random/blank photos)
    function validateImageQuality(context, width, height) {
      const imgData = context.getImageData(0, 0, width, height);
      const pixels = imgData.data;
      let brightness = 0, variance = 0, samples = 0;
      
      for (let i = 0; i < pixels.length; i += (4 * 40)) { // Sample every 40th pixel
        const r = pixels[i], g = pixels[i+1], b = pixels[i+2];
        brightness += (r + g + b) / 3;
        variance += Math.abs(r - g) + Math.abs(g - b);
        samples++;
      }
      
      const avgBrightness = brightness / samples;
      const avgVariance = variance / samples;

      if (avgBrightness < 35) return "Lighting is too dark. Please move to a brighter area.";
      if (avgBrightness > 240) return "Lighting is too bright or washed out.";
      if (avgVariance < 12) return "No clear face detected. Ensure your face is centered.";
      return "passed";
    }

    // 5. Hybrid Location Fetchers
    async function getIPLocationFallback() {
      try {
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();
        return `${data.city}, ${data.region} (IP Fallback)`; 
      } catch (error) {
        return "Location unavailable";
      }
    }

    async function getHybridLocation() {
      return new Promise((resolve) => {
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (position) => { resolve(`${position.coords.latitude}, ${position.coords.longitude} (Exact GPS)`); },
            async (error) => {
              const ipFallback = await getIPLocationFallback();
              resolve(ipFallback);
            },
            { timeout: 5000, enableHighAccuracy: true } 
          );
        } else {
          getIPLocationFallback().then(resolve);
        }
      });
    }

    // 6. Update UI Status dynamically
    function updateStatus(main, sub) {
      statusText.innerText = main;
      statusSubtext.innerText = sub;
    }

    // 7. Form Submission & Processing Pipeline
    scanForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      hideAlert();
      
      if (!iti.isValidNumber()) {
        showAlert("Please enter a valid phone number.", "danger");
        return; 
      }
      
      // UI Transition to Scanning Mode
      scanForm.style.display = 'none';
      statusContainer.style.display = 'block';
      laser.style.display = 'block'; 
      updateStatus("Processing image...", "Requesting secure location & validating frame");

      // Capture frame
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const context = canvas.getContext('2d');
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // Verify image isn't blank/dark
      const qualityCheck = validateImageQuality(context, canvas.width, canvas.height);
      if (qualityCheck !== "passed") {
        statusContainer.style.display = 'none';
        scanForm.style.display = 'block';
        laser.style.display = 'none';
        showAlert(qualityCheck, "warning");
        return;
      }

      // Freeze frame on canvas
      const base64Image = canvas.toDataURL('image/jpeg', 0.85);
      video.style.display = 'none';
      canvas.style.display = 'block';

      // Fetch user location
      const userLocation = await getHybridLocation();

      // Final Payload with correct routing flag
      const payload = {
        type: "web_scan", // Routes directly to Web_Scans tab in Apps Script
        name: document.getElementById('scan-name').value,
        phone: iti.getNumber(),
        location: userLocation,
        imageBase64: base64Image
      };

      try {
        // Step 1: Backup to Google Sheets (Fire and forget)
        updateStatus("Securing data...", "Logging to secure database");
        fetch(APP_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // Step 2: Send to Render AI Backend
        updateStatus("Analyzing skin textures...", "AI is detecting facial features");
        
        const aiResponse = await fetch(RENDER_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!aiResponse.ok) {
          const errorData = await aiResponse.json().catch(() => ({}));
          if (errorData.detail && errorData.detail.includes("glasses")) {
            throw new Error("Glasses detected. Please remove them and try again.");
          }
          throw new Error("Cloud analysis failed. Please ensure your face is clearly visible.");
        }

        const resultData = await aiResponse.json();
        
        // Stop hardware camera
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(track => track.stop());
        }

        // Step 3: Success & Redirect
        updateStatus("Analysis Complete!", "Redirecting to your diagnostic report...");
        laser.style.display = 'none';
        
        setTimeout(() => {
          window.location.href = `results.html?id=${resultData.report_id || 'latest'}`;
        }, 1200);

      } catch (err) {
        console.error("Pipeline Error:", err);
        
        // Reset UI for retry
        laser.style.display = 'none';
        statusContainer.style.display = 'none';
        scanForm.style.display = 'block';
        canvas.style.display = 'none';
        video.style.display = 'block';
        
        showAlert(err.message || "Network timeout. Ensure good internet and try again.", "danger");
      }
    });
    // This function triggers when the user captures their photo
async function sendToPythonCNN(imageBase64) {
  try {
    // 1. Point this to your LIVE Python server, NOT the dead local tunnel
    const apiEndpoint = "https://api.glowvai.in/analyze-skin"; 
    
    console.log("Sending facial data to CNN...");
    
    // 2. Make the POST request to your backend
    const response = await fetch(apiEndpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ image: imageBase64 })
    });

    if (!response.ok) {
      throw new Error("Python Backend is offline or unreachable.");
    }

    // 3. Receive the REAL AI data
    const aiData = await response.json();
    
    // Extract the exact scores from your Python JSON output
    // (Make sure these variable names match exactly what your Python script spits out)
    const realOverallScore = aiData.overall_score; 
    const realClarity = aiData.clarity;
    const realHydration = aiData.hydration;
    const realTexture = aiData.texture;

    // 4. Redirect to the results page with the REAL data embedded in the URL
    window.location.href = `results.html?score=${realOverallScore}&clarity=${realClarity}&hydration=${realHydration}&texture=${realTexture}`;
    
  } catch (error) {
    console.error("CNN Connection Failed:", error);
    // 5. Professional error handling so they don't see a broken page
    alert("Our AI servers are currently processing a high volume of scans. Please try again in a moment.");
  }
}
  </script>
</body>
</html>
